  <body>
<div id="loading-text"
    style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...
  </div>
    <div id="gameContainer"></div>
    <script src="Build/UnityLoader.js"></script>
    <script>
var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '2101.31';
        loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const cache = await caches.open("cuphead-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        return URL.createObjectURL(blob);
      }
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl, asmUrl] = await Promise.all([
        mergeFiles(getParts("Build/CupheadPort.data.unityweb", 1, 103), "CupheadPort.data.unityweb"),
        mergeFiles(getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2), "CupheadPort.wasm.code.unityweb"),
        mergeFiles(getParts("Build/CupheadPort.asm.code.unityweb", 1, 3), "CupheadPort.asm.code.unityweb"),
      ]);

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (url.includes("CupheadPort.data.unityweb")) {
              url = dataUrl;
          } else if (url.includes("CupheadPort.wasm.code.unityweb")) {
              url = wasmUrl;
          } else if (url.includes("CupheadPort.asm.code.unityweb")) {
              url = asmUrl;
          }
          return originalOpen.call(this, method, url, ...rest);
      };
      var unityInstance = UnityLoader.instantiate("gameContainer", "Build/CupheadPort.json");
      loadingText.remove();

      // --- CUSTOM KEYBOARD AND TOUCHPAD INPUT TRANSLATOR LAYER ---
      const gameCanvas = document.querySelector("canvas") || window;
      
      const CUSTOM_MAPPINGS = {
          'KeyA': { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 },
          'KeyD': { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
          'KeyW': { key: 'z', code: 'KeyZ', keyCode: 90 },
          'KeyS': { key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 },
          'KeyE': { key: 'c', code: 'KeyC', keyCode: 67 }
      };

      function sendTranslatedInput(type, config) {
          const gameEvent = new KeyboardEvent(type, {
              key: config.key,
              code: config.code,
              keyCode: config.keyCode,
              which: config.keyCode,
              bubbles: true,
              cancelable: true
          });
          gameCanvas.dispatchEvent(gameEvent);
      }

      window.addEventListener('keydown', (e) => {
          if (CUSTOM_MAPPINGS[e.code]) {
              e.preventDefault();
              sendTranslatedInput('keydown', CUSTOM_MAPPINGS[e.code]);
          }
      });

      window.addEventListener('keyup', (e) => {
          if (CUSTOM_MAPPINGS[e.code]) {
              e.preventDefault();
              sendTranslatedInput('keyup', CUSTOM_MAPPINGS[e.code]);
          }
      });

      window.addEventListener('mousedown', (e) => {
          if (e.button === 0) { // Touchpad Click / Primary Mouse Click
              sendTranslatedInput('keydown', { key: 'x', code: 'KeyX', keyCode: 88 });
          }
      });

      window.addEventListener('mouseup', (e) => {
          if (e.button === 0) {
              sendTranslatedInput('keyup', { key: 'x', code: 'KeyX', keyCode: 88 });
          }
      });

      // Blocks context layout menu popups from interrupting actions
      window.addEventListener('contextmenu', e => e.preventDefault());
      // --- END TRANSLATOR LAYER ---

    })();
    </script>
